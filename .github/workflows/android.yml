name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "./.git/*" \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.10.2"

          if [ -x "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle Wrapper found."
            chmod +x "$PROJECT_DIR/gradlew"
          else
            echo "Gradle Wrapper not found."
            echo "Installing Gradle $GRADLE_VERSION..."

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp

            echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

            echo "Gradle installed successfully."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Android project:"
          pwd

          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarOvertime-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
