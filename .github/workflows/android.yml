name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "ZIP file found:"
          echo "$ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          echo "Extracting ZIP..."
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/android-project"

          echo "ZIP extracted successfully."

          echo "Searching extracted files..."
          find "$GITHUB_WORKSPACE/android-project" \
            -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" -o \
              -name "build.gradle" -o \
              -name "build.gradle.kts" \
            \) | sort

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find "$GITHUB_WORKSPACE/android-project" \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found inside ZIP."

            echo "Extracted repository structure:"
            find "$GITHUB_WORKSPACE/android-project" \
              -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.10.2"

          if [ -x "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle Wrapper found."
            chmod +x "$PROJECT_DIR/gradlew"
          else
            echo "Gradle Wrapper not found."
            echo "Installing Gradle $GRADLE_VERSION..."

            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp

            echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

            echo "Gradle installed successfully."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Android project:"
          pwd

          echo "Project files:"
          ls -la

          if [ -x "./gradlew" ]; then
            echo "Building with Gradle Wrapper..."
            ./gradlew assembleDebug --no-daemon
          else
            echo "Building with installed Gradle..."
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarOvertime-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
